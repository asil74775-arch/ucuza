publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  cached_network_image: ^3.4.1
  fl_chart: ^0.69.2
  photo_view: ^0.15.0
  image_picker: ^1.1.2
  video_player: ^2.9.2
  model_viewer_plus: ^1.9.0
  camera: ^0.11.0+2
  google_mlkit_face_detection: ^0.12.0
  web_socket_channel: ^3.0.1
  url_launcher: ^6.3.1
  intl: ^0.20.3
  http_parser: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
