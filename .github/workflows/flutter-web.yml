name: Flutter Web Build & Deploy

on:
  push:
    branches: [claude/mobile-shopping-ai-analysis-app-l68vqm, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # pubspec.lock requires Flutter >=3.47 / Dart >=3.13; verified locally with 3.50.1.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: mobile
        run: flutter pub get

      - name: Flutter analyze
        working-directory: mobile
        run: flutter analyze --no-fatal-infos

      - name: Flutter build web
        working-directory: mobile
        run: |
          flutter build web \
            --release \
            --no-web-resources-cdn \
            --no-wasm-dry-run \
            --base-href /ucuza/ \
            --dart-define=DEMO=true

      - name: SPA fallback for deep links
        run: cp mobile/build/web/index.html mobile/build/web/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: mobile/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
